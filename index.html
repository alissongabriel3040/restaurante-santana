<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurante Santana - Caixa</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

h1{text-align:center;}

input, button{
    width:100%;
    padding:12px;
    margin-top:10px;
    box-sizing:border-box;
}

#resultado{
    margin-top:20px;
    padding:15px;
    border:1px solid #ccc;
    border-radius:10px;
}

#qrcode{
    display:flex;
    justify-content:center;
    margin-top:20px;
}

/* 🔥 área de impressão */
@media print {
    body * {
        visibility: hidden;
    }

    #printArea, #printArea * {
        visibility: visible;
    }

    #printArea {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
    }
}
</style>
</head>
<body>

<h1>🍽 Restaurante Santana</h1>

<h2>Nova Comanda</h2>

<input type="number" step="0.01" id="valorPrato" placeholder="Valor do prato">

<button onclick="criarComanda()">Criar Comanda</button>

<button onclick="imprimirComanda()" style="background:green;color:white;">
🖨️ Imprimir Comanda
</button>

<div id="resultado"></div>

<div id="qrcode"></div>

<!-- 🧾 ÁREA QUE VAI SER IMPRESSA -->
<div id="printArea"></div>

<script>

let dadosComanda = "";

function criarComanda(){

    let valor = document.getElementById("valorPrato").value;

    if(!valor){
        alert("Digite o valor do prato");
        return;
    }

    let ultimoNumero = localStorage.getItem("ultimaComanda") || 0;

    let numero = Number(ultimoNumero) + 1;

    localStorage.setItem("ultimaComanda", numero);

    let comanda = numero.toString().padStart(3, "0");

    let link =
    "https://alissongabriel3040.github.io/restaurante-santana/cliente.html?comanda="
    + comanda;

    dadosComanda = `
        <h2>🍽 COMANDA RESTAURANTE SANTANA</h2>
        <p><b>Número:</b> ${comanda}</p>
        <p><b>Valor:</b> R$ ${Number(valor).toFixed(2)}</p>
        <p><b>Link:</b> ${link}</p>
    `;

    document.getElementById("resultado").innerHTML = `
        <h3>Comanda criada</h3>
        <p><b>Comanda:</b> ${comanda}</p>
        <p><b>Prato:</b> R$ ${Number(valor).toFixed(2)}</p>
    `;

    document.getElementById("qrcode").innerHTML = "";

    new QRCode(
        document.getElementById("qrcode"),
        {
            text: link,
            width: 220,
            height: 220
        }
    );

    document.getElementById("printArea").innerHTML = dadosComanda;
}

function imprimirComanda(){
    if(!dadosComanda){
        alert("Crie uma comanda primeiro!");
        return;
    }

    window.print();
}

</script>

</body>
</html>
