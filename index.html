<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurante Santana - Caixa</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: auto;
    padding: 20px;
    background: #f4f4f4;
}

h1{
    text-align:center;
}

input, button{
    width:100%;
    padding:12px;
    margin-top:10px;
    box-sizing:border-box;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    cursor:pointer;
    border:none;
    font-size:16px;
}

#resultado{
    margin-top:20px;
    padding:15px;
    background:white;
    border-radius:10px;
}

#qrcode{
    display:flex;
    justify-content:center;
    margin-top:20px;
}

button.criar{
    background: blue;
    color:white;
}

button.imprimir{
    background: green;
    color:white;
}
</style>
</head>
<body>

<h1>🍽 Restaurante Santana</h1>

<h2>Nova Comanda</h2>

<input type="number" step="0.01" id="valorPrato" placeholder="Valor do prato">

<button class="criar" onclick="criarComanda()">Criar Comanda</button>

<button class="imprimir" onclick="imprimirComanda()">
🖨️ Imprimir Comanda
</button>

<div id="resultado"></div>

<div id="qrcode"></div>

<script>

let dadosComanda = "";
    const API_URL =
"https://script.google.com/macros/s/AKfycbySZoE2S3Z0U8z_NT2z3sZ1YbvuaAr_8jxYSk94ysFF4_h-behfftGbYludlEWHd6q2/exec";

function criarComanda(){

    let valor = document.getElementById("valorPrato").value;

    if(!valor){
        alert("Digite o valor do prato");
        return;
    }

    let ultimoNumero = localStorage.getItem("ultimaComanda") || 0;

    let numero = Number(ultimoNumero) + 1;

    localStorage.setItem("ultimaComanda", numero);

    let comanda = numero.toString().padStart(3, "0");
    fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
        comanda:comanda,
        mesa:"0",
        item:"Prato por quilo",
        valor:Number(valor)
    })
});

    let link =
    "https://alissongabriel3040.github.io/restaurante-santana/cliente.html?comanda="
    + comanda;

    dadosComanda = `
        <h2>🍽 COMANDA RESTAURANTE SANTANA</h2>
        <hr>
        <p><b>Número:</b> ${comanda}</p>
        <p><b>Valor:</b> R$ ${Number(valor).toFixed(2)}</p>
        <p><b>Link:</b> ${link}</p>
    `;

    document.getElementById("resultado").innerHTML = dadosComanda;

    document.getElementById("qrcode").innerHTML = "";

    new QRCode(
        document.getElementById("qrcode"),
        {
            text: link,
            width: 200,
            height: 200
        }
    );
}

function imprimirComanda(){

    if(!dadosComanda){
        alert("Crie uma comanda primeiro!");
        return;
    }

    let janela = window.open("", "", "width=400,height=600");

    janela.document.write(`
        <html>
        <head>
        <title>Comanda</title>
        <style>
            body{
                font-family: Arial;
                text-align:center;
                padding:20px;
            }
            h2{
                font-size:18px;
            }
            hr{
                margin:10px 0;
            }
        </style>
        </head>
        <body>
            ${dadosComanda}

            <script>
                window.onload = function(){
                    window.print();
                    window.onafterprint = function(){
                        window.close();
                    }
                }
            <\/script>
        </body>
        </html>
    `);

    janela.document.close();
}

</script>

</body>
</html>
