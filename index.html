<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurante Santana - Caixa</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

h1{
    text-align:center;
}

input, button{
    width:100%;
    padding:12px;
    margin-top:10px;
    box-sizing:border-box;
}

#resultado{
    margin-top:20px;
    padding:15px;
    border:1px solid #ccc;
    border-radius:10px;
}

#qrcode{
    display:flex;
    justify-content:center;
    margin-top:20px;
}
</style>
</head>
<body>

<h1>🍽 Restaurante Santana</h1>

<h2>Nova Comanda</h2>

<input
type="number"
step="0.01"
id="valorPrato"
placeholder="Valor do prato">

<button onclick="criarComanda()">
Criar Comanda
</button>

<div id="resultado"></div>

<div id="qrcode"></div>

<script>

function criarComanda(){

    let valor = document.getElementById("valorPrato").value;

    if(!valor){
        alert("Digite o valor do prato");
        return;
    }

    let numero = Date.now();

    let link =
    "https://alissongabriel3040.github.io/restaurante-santana/cliente.html?comanda="
    + numero;

    document.getElementById("resultado").innerHTML = `
        <h3>Comanda criada</h3>
        <p><b>Número:</b> ${numero}</p>
        <p><b>Prato:</b> R$ ${Number(valor).toFixed(2)}</p>
    `;

    document.getElementById("qrcode").innerHTML = "";

    new QRCode(
        document.getElementById("qrcode"),
        {
            text: link,
            width: 220,
            height: 220
        }
    );
}

</script>

</body>
</html>
