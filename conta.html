<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbySZoE2S3Z0U8z_NT2z3sZ1YbvuaAr_8jxYSk94ysFF4_h-behfftGbYludlEWHd6q2/exec";

async function buscarConta(){

    let comanda =
    document.getElementById("comanda").value;

    if(!comanda){
        alert("Digite a comanda.");
        return;
    }

    let resposta =
    await fetch(API_URL + "?comanda=" + comanda);

    let dados =
    await resposta.json();

    let html =
    "<h2>Comanda " + dados.comanda + "</h2>";

    if(dados.itens.length === 0){

        html += "<p>Nenhum item encontrado.</p>";

    }else{

        dados.itens.forEach(item => {

            html += `
                <p>
                ${item.item}
                - R$ ${Number(item.valor).toFixed(2)}
                </p>
            `;

        });

        html += `
            <hr>

            <h2>
            Total: R$ ${Number(dados.total).toFixed(2)}
            </h2>

            <button onclick="window.print()">
            🖨️ Imprimir Conta
            </button>
        `;
    }

    document.getElementById("resultado").innerHTML =
    html;
}

</script>
