```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurante Santana - Caixa Novo</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 700px;
    margin:auto;
    padding:20px;
    background:#f4f4f4;
}

h1,h2{
    text-align:center;
}

input,button{
    width:100%;
    padding:12px;
    margin-top:8px;
    box-sizing:border-box;
}

button{
    cursor:pointer;
}

.prato{
    margin-bottom:10px;
}

#resultado{
    background:white;
    padding:15px;
    margin-top:20px;
    border-radius:10px;
}

#qrcode{
    margin-top:20px;
    display:flex;
    justify-content:center;
}
</style>
</head>
<body>

<h1>🍽 Restaurante Santana</h1>

<h2>Nova Comanda</h2>

<div id="pratos">
<input type="number" step="0.01" class="prato" placeholder="Valor do prato por quilo">
</div>

<button onclick="adicionarPrato()">➕ Adicionar outro prato</button>

<h3>Bebidas e Sobremesas</h3>

<label>Coca-Cola 600ml</label>
<input type="number" id="coca" value="0" min="0">

<label>Guaraná</label>
<input type="number" id="guarana" value="0" min="0">

<label>Água</label>
<input type="number" id="agua" value="0" min="0">

<label>Petit Gâteau</label>
<input type="number" id="petit" value="0" min="0">

<button onclick="criarComanda()">Criar Comanda</button>

<button onclick="imprimirComanda()">🖨️ Imprimir Comanda</button>

<div id="resultado"></div>

<div id="qrcode"></div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbySZoE2S3Z0U8z_NT2z3sZ1YbvuaAr_8jxYSk94ysFF4_h-behfftGbYludlEWHd6q2/exec";

let dadosComanda = "";

function adicionarPrato(){

    let input = document.createElement("input");

    input.type = "number";
    input.step = "0.01";
    input.placeholder = "Valor do prato por quilo";
    input.className = "prato";

    document.getElementById("pratos")
    .appendChild(input);
}

async function criarComanda(){

    let ultimoNumero =
    localStorage.getItem("ultimaComanda") || 0;

    let numero = Number(ultimoNumero) + 1;

    localStorage.setItem("ultimaComanda", numero);

    let comanda =
    numero.toString().padStart(3,"0");

    let total = 0;
    let itensHTML = "";

    let pratos =
    document.querySelectorAll(".prato");

    for(let prato of pratos){

        let valor =
        Number(prato.value);

        if(valor > 0){

            total += valor;

            itensHTML +=
            `<p>Prato por quilo - R$ ${valor.toFixed(2)}</p>`;

            await fetch(API_URL,{
                method:"POST",
                body:JSON.stringify({
                    comanda:comanda,
                    mesa:"0",
                    item:"Prato por quilo",
                    valor:valor
                })
            });
        }
    }

    let bebidas = [
        {
            nome:"Coca-Cola 600ml",
            qtd:Number(document.getElementById("coca").value),
            valor:6
        },
        {
            nome:"Guaraná",
            qtd:Number(document.getElementById("guarana").value),
            valor:5
        },
        {
            nome:"Água",
            qtd:Number(document.getElementById("agua").value),
            valor:3
        },
        {
            nome:"Petit Gâteau",
            qtd:Number(document.getElementById("petit").value),
            valor:15
        }
    ];

    for(let bebida of bebidas){

        if(bebida.qtd > 0){

            let subtotal =
            bebida.qtd * bebida.valor;

            total += subtotal;

            itensHTML +=
            `<p>${bebida.nome} (${bebida.qtd}x) - R$ ${subtotal.toFixed(2)}</p>`;

            for(let i=0;i<bebida.qtd;i++){

                await fetch(API_URL,{
                    method:"POST",
                    body:JSON.stringify({
                        comanda:comanda,
                        mesa:"0",
                        item:bebida.nome,
                        valor:bebida.valor
                    })
                });

            }
        }
    }

    let link =
    "https://alissongabriel3040.github.io/restaurante-santana/cliente.html?comanda="
    + comanda;

    dadosComanda = `
        <h2>🍽 COMANDA ${comanda}</h2>
        ${itensHTML}
        <hr>
        <h3>TOTAL PARCIAL: R$ ${total.toFixed(2)}</h3>
    `;

    document.getElementById("resultado")
    .innerHTML = dadosComanda;

    document.getElementById("qrcode")
    .innerHTML = "";

    new QRCode(
        document.getElementById("qrcode"),
        {
            text:link,
            width:220,
            height:220
        }
    );
}

function imprimirComanda(){

    let qr =
    document.getElementById("qrcode").innerHTML;

    let janela =
    window.open("","","width=500,height=700");

    janela.document.write(`
    <html>
    <body style="font-family:Arial;padding:20px;text-align:center;">
    ${dadosComanda}
    ${qr}
    <script>
    window.onload=function(){
        window.print();
    }
    <\/script>
    </body>
    </html>
    `);

    janela.document.close();
}

</script>

</body>
</html>
```
