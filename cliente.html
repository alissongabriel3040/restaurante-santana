<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurante Santana</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

h1{
    text-align:center;
}

select, button{
    width:100%;
    padding:12px;
    margin-top:10px;
}

.item{
    border:1px solid #ccc;
    padding:10px;
    margin-top:10px;
    border-radius:8px;
}
</style>
</head>
<body>

<h1>🍽 Restaurante Santana</h1>

<h2 id="tituloComanda"></h2>

<label>Mesa:</label>

<select id="mesa">
<option value="">Selecione a mesa</option>
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10</option>
</select>

<div class="item">
<input type="checkbox" id="coca">
<label>Coca-Cola 600ml - R$ 6,00</label>
</div>

<div class="item">
<input type="checkbox" id="guarana">
<label>Guaraná - R$ 5,00</label>
</div>

<div class="item">
<input type="checkbox" id="agua">
<label>Água - R$ 3,00</label>
</div>

<div class="item">
<input type="checkbox" id="petit">
<label>Petit Gâteau - R$ 15,00</label>
</div>

<button onclick="enviarPedido()">
Enviar Pedido
</button>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbySZoE2S3Z0U8z_NT2z3sZ1YbvuaAr_8jxYSk94ysFF4_h-behfftGbYludlEWHd6q2/exec";

const params = new URLSearchParams(window.location.search);
const comanda = params.get("comanda");

document.getElementById("tituloComanda").innerText =
"Comanda #" + comanda;

async function enviarPedido(){

    let mesa = document.getElementById("mesa").value;

    if(!mesa){
        alert("Selecione a mesa.");
        return;
    }

    let pedidos = [];

    if(document.getElementById("coca").checked){
        pedidos.push({
            item:"Coca-Cola 600ml",
            valor:6
        });
    }

    if(document.getElementById("guarana").checked){
        pedidos.push({
            item:"Guaraná",
            valor:5
        });
    }

    if(document.getElementById("agua").checked){
        pedidos.push({
            item:"Água",
            valor:3
        });
    }

    if(document.getElementById("petit").checked){
        pedidos.push({
            item:"Petit Gâteau",
            valor:15
        });
    }

    if(pedidos.length === 0){
        alert("Selecione pelo menos um item.");
        return;
    }

    for(let pedido of pedidos){

        await fetch(API_URL,{
            method:"POST",
            body:JSON.stringify({
                comanda:comanda,
                mesa:mesa,
                item:pedido.item,
                valor:pedido.valor
            })
        });

    }

    alert("Pedido enviado com sucesso!");
}

</script>

</body>
</html>
