<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cliente - Restaurante Santana</title>

<style>
body{
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

h1{
    text-align:center;
}

h2{
    text-align:center;
}

select, button{
    width:100%;
    padding:12px;
    margin-top:10px;
}

.item{
    margin-top:10px;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}
</style>
</head>
<body>

<h1>🍽 Restaurante Santana</h1>

<h2>Pedido da Mesa</h2>

<label>Selecione a mesa:</label>

<select id="mesa">
<option value="">Selecione</option>
<option>1</option>
<option>2</option>
<option>3</option>
<option>4</option>
<option>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
<option>9</option>
<option>10</option>
</select>

<h3>Bebidas e Sobremesas</h3>

<div class="item">
<input type="checkbox" id="coca">
Coca-Cola 600ml - R$ 6,00
</div>

<div class="item">
<input type="checkbox" id="guarana">
Guaraná - R$ 5,00
</div>

<div class="item">
<input type="checkbox" id="agua">
Água - R$ 3,00
</div>

<div class="item">
<input type="checkbox" id="petit">
Petit Gâteau - R$ 15,00
</div>

<button onclick="enviarPedido()">
Enviar Pedido
</button>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbySZoE2S3Z0U8z_NT2z3sZ1YbvuaAr_8jxYSk94ysFF4_h-behfftGbYludlEWHd6q2/exec";

function enviarPedido(){

    let mesa = document.getElementById("mesa").value;

    if(!mesa){
        alert("Selecione uma mesa.");
        return;
    }

    let pedidos = [];

    if(document.getElementById("coca").checked){
        pedidos.push({
            item:"Coca-Cola 600ml",
            valor:6
        });
    }

    if(document.getElementById("guarana").checked){
        pedidos.push({
            item:"Guaraná",
            valor:5
        });
    }

    if(document.getElementById("agua").checked){
        pedidos.push({
            item:"Água",
            valor:3
        });
    }

    if(document.getElementById("petit").checked){
        pedidos.push({
            item:"Petit Gâteau",
            valor:15
        });
    }

    if(pedidos.length === 0){
        alert("Escolha pelo menos um item.");
        return;
    }

    pedidos.forEach(pedido => {

        fetch(API_URL,{
            method:"POST",
            body:JSON.stringify({
                cliente.html?comanda=001,
                mesa:mesa,
                item:pedido.item,
                valor:pedido.valor
            })
        });

    });

    alert("Pedido enviado com sucesso!");

    document.getElementById("coca").checked = false;
    document.getElementById("guarana").checked = false;
    document.getElementById("agua").checked = false;
    document.getElementById("petit").checked = false;
}

</script>

</body>
</html>
